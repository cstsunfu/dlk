[build-system]
requires = [
    "setuptools>=18.0",
]
build-backend = "setuptools.build_meta"


[project]
name="dlk"
authors = [
    {name = "cstsunfu", email = "cstsunfu@gmail.com"},
]
readme = "README.md"
dependencies = [
    "intc>=0.1.1,<0.2",
    "hjson>=3.0.2",
    "pandas>=1.4",
    "fsspec>=2023.5,<=2025.5",
    "tabulate>=0.9.0,<=1.0",
    "torchmetrics>=1.2.1",
    "ray[train,tune,serve]>=2.40.0,<3.0",
    "pyarrow>=10.0.1",
    "transformers>=4.37.0,<4.54",
]
dynamic = ["version", "license", "description"]
requires-python = ">=3.9"
keywords = ["dlk", "pytorch", "lightning"]
classifiers = [
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "License :: OSI Approved :: Apache Software License"
]

[project.optional-dependencies]
train = [
    "lightning>=2.5.0,<=2.6",
    "torch>=2.1,<=2.6",
    "tensorboard>=2.7.0,<3.0",
    "datasets>=2.17.0,<2.20",
    "torchmetrics>=1.2.1",
    "optuna>=4.4.0,<5.0",
    "optuna-dashboard>=0.19.0,<0.20",
    "sqlalchemy>=2.0.0,<3.0",
    "alembic>=1.10.0,<2.0",
]
export = [
    "torch>=1.8.1,<=2.6",
    "lightning>=2.5.0,<=2.6",
    "torchmetrics>=1.2.1",
    "onnx>=1.18.0,<2.0",
    "onnxruntime>=1.15.0,<2.0",
]
process = [
    "datasets>=2.17.0,<2.20",
]
all = [
    "lightning>=2.5.0,<=2.6",
    "torch>=2.1,<=2.6",
    "tensorboard>=2.7.0,<3.0",
    "datasets>=2.17.0,<2.20",
    "streamlit>=1.32",
    "svgwrite>=1.4",
    "pyecharts>=2.0",
    "optuna>=4.4.0,<5.0",
    "optuna-dashboard>=0.19.0,<0.20",
    "sqlalchemy>=2.0.0,<3.0",
    "alembic>=1.10.0,<2.0",
    "onnx>=1.18.0,<2.0",
    "onnxruntime>=1.15.0,<2.0",
]
